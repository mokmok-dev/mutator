name: mutation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  # Cancel superseded pull request runs. A push to `main` is left alone: it is the
  # run that saves the verdict cache, and cancelling it loses that work.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # `--cache` reuses a mutant's verdict while its package is byte-for-byte
  # unchanged, so an unchanged package costs a hash instead of a test run.
  CACHE_DIR: target/mutator-cache

jobs:
  # The tool's own score must stay at 100%: every mutant cargo-mutants can generate
  # is killed by this crate's tests.
  #
  # This run is cold: every commit changes the crate, so the fingerprint misses and
  # all 428 mutants are built and tested. The same work varies a lot between
  # hosted runners. Run 45173489766 took 21m08s. Run 45173146724 reached the
  # 30-minute mark and was cancelled, and its gate printed `score: 100.00%` two
  # seconds after that mark, so nothing was wrong but the budget. A cancel also
  # skips the cache save, so the budget is sized past the slow end of the spread.
  self:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@129f07902485941992791c670de648dbe572a9ac # v3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_DIR }}
          # Verdicts survive while the package's contents are the same; the key
          # only decides how often the archive is re-saved.
          key: mutator-cache-self-${{ github.run_id }}
          restore-keys: |
            mutator-cache-self-
      - run: nix develop --command cargo build
      - name: Mutation gate
        run: nix develop --command ./target/debug/mutator --cache --fail-on-survived

  # The flake exposes the binary as `packages.<system>.default` and as
  # `apps.<system>.default`, so a consumer can take it as an input. Every system
  # the flake declares is built here, so a platform regression cannot land.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@129f07902485941992791c670de648dbe572a9ac # v3
      - run: nix build .#packages.${{ matrix.system }}.default
      - run: nix run .#packages.${{ matrix.system }}.default -- --version

  # The tool's reason to exist: PRs run only the mutants their diff can affect.
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@129f07902485941992791c670de648dbe572a9ac # v3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_DIR }}
          key: mutator-cache-pr-${{ github.run_id }}
          restore-keys: |
            mutator-cache-pr-
            mutator-cache-self-
      - run: nix develop --command cargo build
      # Annotations go to stdout for the diff view, and the step summary carries the
      # metrics a reviewer reads without opening the log. The exit code is the gate.
      - name: Run the mutants this diff can affect
        run: |
          nix develop --command ./target/debug/mutator \
            --since "origin/${{ github.base_ref }}" \
            --cache \
            --fail-on-survived \
            --reporter text \
            --reporter github \
            --summary "$GITHUB_STEP_SUMMARY"

  # Records cold, warm, and partial-invalidation timings on a fixture, and fails only
  # if a cached run disagrees with an uncached one. Wall-clock numbers vary too much
  # between runners to gate on, so the timings are read, not asserted.
  bench:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@129f07902485941992791c670de648dbe572a9ac # v3
      - run: nix develop --command cargo build
      - name: Cache granularity benchmark
        run: |
          {
            echo '## Mutation cache benchmark'
            echo
            nix develop --command env ROUNDS=3 bash bench/cache-granularity.sh
          } | tee -a "$GITHUB_STEP_SUMMARY"
