name: mutation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The tool's own score must stay at 100%: every mutant cargo-mutants can generate
  # is killed by this crate's tests.
  self:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@129f07902485941992791c670de648dbe572a9ac # v3
      - run: nix develop --command cargo mutants --no-times

  # The tool's reason to exist: PRs run only the mutants their diff can affect.
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@129f07902485941992791c670de648dbe572a9ac # v3
      - run: nix develop --command cargo build
      - name: Run the mutants this diff can affect
        run: |
          nix develop --command ./target/debug/mutator \
            --since "origin/${{ github.base_ref }}" \
            --fail-on-survived \
            --reporter text \
            --reporter github
