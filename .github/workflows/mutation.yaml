name: mutation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `--cache` reuses a mutant's verdict while its package is byte-for-byte
  # unchanged, so an unchanged package costs a hash instead of a test run.
  CACHE_DIR: target/mutator-cache

jobs:
  # The tool's own score must stay at 100%: every mutant cargo-mutants can generate
  # is killed by this crate's tests.
  self:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@129f07902485941992791c670de648dbe572a9ac # v3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CACHE_DIR }}
          # Verdicts survive while the package's contents are the same; the key
          # only decides how often the archive is re-saved.
          key: mutator-cache-self-${{ github.run_id }}
          restore-keys: |
            mutator-cache-self-
      - run: nix develop --command cargo build
      - name: Mutation gate
        run: nix develop --command ./target/debug/mutator --cache --fail-on-survived

  # The flake exposes the binary as `packages.<system>.default` and as
  # `apps.<system>.default`, so a consumer can take it as an input.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@129f07902485941992791c670de648dbe572a9ac # v3
      - run: nix build .#default
      - run: nix run . -- --version

  # The tool's reason to exist: PRs run only the mutants their diff can affect.
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@129f07902485941992791c670de648dbe572a9ac # v3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: mutator-cache-pr-${{ github.run_id }}
          restore-keys: |
            mutator-cache-pr-
            mutator-cache-self-
      - run: nix develop --command cargo build
      - name: Run the mutants this diff can affect
        run: |
          nix develop --command ./target/debug/mutator \
            --since "origin/${{ github.base_ref }}" \
            --cache \
            --fail-on-survived \
            --reporter text \
            --reporter github
